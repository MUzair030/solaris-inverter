plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.ThreepolApps.homeautomation.smartlife"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId "com.ThreepolApps.homeautomation.smartlife"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 35
        versionCode flutter.versionCode.toInteger()
        versionName flutter.versionName

        multiDexEnabled true
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
        // Add this for permission compatibility
//        manifestPlaceholders += [
//                'appAuthRedirectScheme': 'com.ThreepolApps.homeautomation.smartlife'
//        ]
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    externalNativeBuild {
        cmake {
            // If using CMake, pass 16KB page size flag
//            arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        }
    }
    signingConfigs {
        release {
            def keystoreFile = System.getenv("CM_KEYSTORE_PATH")
            if (keystoreFile != null) {
                storeFile file(keystoreFile)
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CM_KEY_ALIAS")
                keyPassword System.getenv("CM_KEY_PASSWORD")
            } else {
                storeFile file("inverterkey.jks") // fallback for local builds if it exists
                storePassword "inverterkey"
                keyAlias "inverterkey"
                keyPassword "inverterkey"
            }
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
