plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.ThreepolApps.homeautomation.smartlife"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId "com.ThreepolApps.homeautomation.smartlife"
        minSdk = 21
        targetSdk = 35
        versionCode 24
        versionName "1.3.4.0"

        multiDexEnabled true
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    signingConfigs {
        release {
            storeFile file("inverterkey.jks") // Keystore file
            storePassword "inverterkey"
            keyAlias "inverterkey"
            keyPassword "inverterkey"
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Required by flutter_local_notifications and other plugins using Java 8+ APIs
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Required for flutter_local_notifications (Java 8+ desugaring on older Android APIs)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
